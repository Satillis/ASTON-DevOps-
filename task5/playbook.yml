---
- name: Setup Nginx server
  hosts: web
  become: yes

  tasks:

    - name: Update apt cache and upgrade packages
      apt:
        update_cache: yes
        upgrade: dist

    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Ensure Nginx is running
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Replace default Nginx page
      copy:
        dest: /var/www/html/index.html
        content: |
          <html>
          <head>
              <title>My Ansible Nginx Page</title>
          </head>
          <body>
              <h1>Hello from Ansible!(Aston)</h1>
              <p>Nginx successfully installed and configured.</p>
          </body>
          </html>
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Restart Nginx
      service:
        name: nginx
        state: restarted